[workspace]
members = ["tools/refresh-docs"]
resolver = "3"

[package]
name = "serenade-rangular-mcp"
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
description = "Source-backed Serenade and Rangular documentation MCP"
readme = "docs/README.md"
publish = true
authors = ["Interchouette"]
repository = "https://github.com/Interchouette-ITC/serenade-rangular-mcp"
homepage = "https://docs.serenade.rs"
license = "Apache-2.0"
include = ["src/**", "tests/**", "build.rs", "Cargo.toml", "corpus/**", "docs/**", "docker/README.md", "LICENSE"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
] }
clap = { version = "4", features = ["derive", "env"] }
include_dir = "0.7"
rangular-parser = "=1.1.0"
rmcp = { version = "3.11.0", default-features = false, features = [
  "server",
  "macros",
  "transport-io",
  "transport-streamable-http-server",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "io-util",
  "net",
  "process",
  "signal",
] }
toml = "1.2.2"
tower = { version = "0.5", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
rmcp = { version = "3.11.0", default-features = false, features = [
  "client",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
] }
tokio = { version = "1", features = ["process", "time"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
opt-level = "s"
