name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to rebuild
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-machete
      - name: Validate release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "serenade-rangular-mcp") | .version')"
          test "$TAG" = "v$VERSION" || { echo "Tag does not match Cargo version $VERSION"; exit 1; }
          RELEASE="$(gh release view "$TAG" --json isDraft,isPrerelease)"
          test "$(jq -r '.isDraft' <<<"$RELEASE")" = false || { echo "Release is a draft"; exit 1; }
          PRERELEASE="$(jq -r '.isPrerelease' <<<"$RELEASE")"
          case "$VERSION" in
            *+*) echo "Build metadata is not supported in Docker tags"; exit 1 ;;
            *-*) test "$PRERELEASE" = true || { echo "Prerelease versions must be marked as prereleases"; exit 1; } ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: make ci
      - run: cargo build --release --locked --bin serenade-rangular-mcp
      - name: Package and smoke-test binary
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          NAME="serenade-rangular-mcp-${TAG}-x86_64-unknown-linux-gnu"
          cp target/release/serenade-rangular-mcp "dist/$NAME"
          "dist/$NAME" --version
          cd dist
          sha256sum "$NAME" > "$NAME.sha256"
          sha256sum -c "$NAME.sha256"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber

  platform-assets:
    needs: build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe
          - os: macos-15
            target: aarch64-apple-darwin
            extension: ""
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve source bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$TARGET"
      - run: cargo build --release --locked --bin serenade-rangular-mcp
      - name: Package and smoke-test binary
        env:
          TAG: ${{ needs.build.outputs.tag }}
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          mkdir -p dist
          NAME="serenade-rangular-mcp-${TAG}-${TARGET}${EXTENSION}"
          cp "target/release/serenade-rangular-mcp${EXTENSION}" "dist/$NAME"
          "dist/$NAME" --version
          cd dist
          if [ "$RUNNER_OS" = macOS ]; then
            shasum -a 256 "$NAME" > "$NAME.sha256"
            shasum -a 256 -c "$NAME.sha256"
          else
            sha256sum "$NAME" > "$NAME.sha256"
            sha256sum -c "$NAME.sha256"
          fi
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber

  publish-crate:
    if: needs.build.outputs.prerelease == 'false'
    needs: build
    runs-on: ubuntu-latest
    environment: crates-io
    concurrency:
      group: crates-io-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "serenade-rangular-mcp") | .version')"
          RESPONSE="$(mktemp)"
          trap 'rm -f "$RESPONSE"' EXIT
          STATUS="$(curl --silent --show-error --location -A 'serenade-rangular-mcp release workflow' -o "$RESPONSE" -w '%{http_code}' "https://crates.io/api/v1/crates/serenade-rangular-mcp/$VERSION")"
          case "$STATUS" in
            200) echo "Version $VERSION is already published; skipping." ;;
            404) cargo publish --locked ;;
            *) echo "Cannot check crates.io publication status (HTTP $STATUS)"; exit 1 ;;
          esac

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - run: make docker-build-release
      - if: needs.build.outputs.prerelease == 'false'
        run: make docker-tag-latest
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: make docker-push-release-hub
      - if: needs.build.outputs.prerelease == 'false'
        run: make docker-push-latest-hub
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}
      - run: make docker-push-release-ghcr-personal
      - if: needs.build.outputs.prerelease == 'false'
        run: make docker-push-latest-ghcr-personal
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME_ITC }}
          password: ${{ secrets.GHCR_PAT_ITC }}
      - run: make docker-push-release-ghcr-itc
      - if: needs.build.outputs.prerelease == 'false'
        run: make docker-push-latest-ghcr-itc
